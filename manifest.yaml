apiVersion: v1
kind: Plugin
metadata:
  author: dxzk
  name: PromptGuardian
  repository: 'https://github.com/zetianliyu/prompt-guardian'
  version: 0.1.6
  description:
    en_US: Rule-based plus LLM-reviewed prompt-injection guard. Blocks jailbreaks in group chats and files a ticket (group, user, question) for human follow-up.
    zh_Hans: 规则预筛 + LLM 复核的提示词注入防护。拦截群聊越狱，并记录「哪个群、哪个用户、问了什么」供人工客服处理。
  label:
    en_US: Prompt Guardian
    zh_Hans: 提示词注入防护
  icon: assets/icon.svg
spec:
  config:
    - name: enabled
      type: boolean
      label:
        en_US: Enable
        zh_Hans: 启用插件
      description:
        en_US: Master switch for prompt-injection detection.
        zh_Hans: 提示词注入检测总开关。
      default: true
      required: false

    - name: llm_analysis_mode
      type: select
      label:
        en_US: LLM review mode
        zh_Hans: LLM 复核模式
      description:
        en_US: "standby: review only when rules flag a risk. active: review every group message. disabled: rules only (block on medium/high)."
        zh_Hans: "standby：规则非 none 才复核。active：每条群消息都复核。disabled：只靠规则，medium/high 直接拦截。"
      default: standby
      required: false
      options:
        - name: standby
          label:
            en_US: Standby (rules first)
            zh_Hans: 待机（规则预筛）
        - name: active
          label:
            en_US: Active (every message)
            zh_Hans: 活跃（每条复核）
        - name: disabled
          label:
            en_US: Disabled (rules only)
            zh_Hans: 禁用（仅规则）

    - name: review_llm_model
      type: llm-model-selector
      label:
        en_US: Review LLM
        zh_Hans: 复核用模型
      description:
        en_US: Model used for semantic review. Empty = first available model. If no model is configured, medium/high rule hits are blocked without LLM review.
        zh_Hans: 语义复核使用的模型。留空则用第一个可用模型。若系统里没有任何模型，则按规则 medium/high 直接拦截。
      default: ''
      required: false

    - name: scope_jailbreak
      type: boolean
      label:
        en_US: Scope — prompt injection / jailbreak
        zh_Hans: 拦截对象：提示词注入/越狱
      description:
        en_US: "Recall rules plus the review criteria for injection, jailbreaks, DAN and role-play breakouts. Uses the built-in PTD 4.1 library."
        zh_Hans: "拦这一类：提示词注入、越狱、忽略规则、DAN、角色扮演突破。用内置 PTD 4.1 规则库，无需再加词。"
      default: true
      required: false

    - name: scope_knowledge
      type: boolean
      label:
        en_US: Scope — probing the knowledge base / data sources
        zh_Hans: 拦截对象：打探知识库/数据来源
      description:
        en_US: "Users asking which knowledge-base entry an answer came from, entry numbers, retrieval sources, or per-item data provenance."
        zh_Hans: "拦这一类：追问答案出自哪条知识库、条目编号、检索来源、逐条给出数据来源依据。「知识库里有退款政策吗」这种业务咨询不拦。"
      default: false
      required: false

    - name: scope_tooling
      type: boolean
      label:
        en_US: Scope — probing plugins / MCP / tool lists
        zh_Hans: 拦截对象：打探插件/MCP/工具列表
      description:
        en_US: "Users probing which plugins, MCP servers, tools or vector stores the bot runs."
        zh_Hans: "拦这一类：打探机器人接了哪些插件、MCP、工具列表、向量库。问 App 产品自己的插件怎么装不拦。"
      default: false
      required: false

    - name: scope_nsfw
      type: boolean
      label:
        en_US: Scope — sexual / adult content
        zh_Hans: 拦截对象：色情/18禁
      description:
        en_US: "Sexual and adult content. Medical, sex-harassment complaints and age-rating questions stay allowed."
        zh_Hans: "拦这一类：色情、18禁、露骨性描写。医学科普、性骚扰投诉、年龄分级说明不拦。"
      default: false
      required: false

    - name: scope_custom_targets
      type: array[string]
      label:
        en_US: Custom blocking objects
        zh_Hans: 自定义拦截对象
      description:
        en_US: "One plain-language object per line, e.g. `竞品报价`. The name itself becomes a recall keyword and is written into the review criteria — do not write prompts here."
        zh_Hans: "每行一个对象名，白话即可，例如 `竞品报价`、`内部工号`。名字本身会当成召回关键词，并写进复核标准。这里不要写提示词。"
      default: []
      required: false

    - name: scope_keywords
      type: array[string]
      label:
        en_US: Extra keywords
        zh_Hans: 补充关键词
      description:
        en_US: "Gap-filling for the scopes above, one `keyword:weight` per line (1-10, defaults to 5)."
        zh_Hans: "给上面的拦截对象补漏词，不是独立功能。每行 `关键词:权重`（1-10，省略按 5）。"
      default: []
      required: false

    - name: scope_regex
      type: array[string]
      label:
        en_US: Extra regexes
        zh_Hans: 补充正则
      description:
        en_US: "Gap-filling for the scopes above, one `pattern:weight` per line. Python regex, case-insensitive; invalid patterns are skipped with a log line."
        zh_Hans: "同上，每行 `正则:权重`。Python 正则，不区分大小写；写错的会跳过并打日志。避免嵌套量词。"
      default: []
      required: false

    - name: disabled_rule_names
      type: array[string]
      label:
        en_US: Disabled built-in rules
        zh_Hans: 停用的内置规则
      description:
        en_US: "Built-in rule names to switch off, one per line. Catalogue: `docs/RULES.md`."
        zh_Hans: "要关掉的内置规则名，每行一个。清单见 `docs/RULES.md`。"
      default: []
      required: false

    - name: admin_user_ids
      type: array[string]
      label:
        en_US: Admin user IDs
        zh_Hans: 管理员用户 ID
      description:
        en_US: "IDs that receive a private ticket. For QQ official bots paste ONLY the openid after `person` in session monitor (32 hex chars), NOT the QQ number and NOT `C2C_MESSAGE_CREATE, person …`. Pipeline 'admin' permission is unrelated. Empty = JSONL only."
        zh_Hans: "命中后接收私聊病单的账号。QQ 官方机器人请只填会话监控里 person 后面那串 openid（32 位），不要填 QQ 号，也不要整段粘贴 C2C_MESSAGE_CREATE, person …。流水线里把会话设成「管理员」不会通知到这里。留空则只写 JSONL。"
      default: []
      required: false

    - name: admin_notify_bot
      type: bot-selector
      label:
        en_US: Notify via bot
        zh_Hans: 通知所用机器人
      description:
        en_US: "Bot used to send the admin private message. Empty = the bot that received the group message. The plugin uses the selected bot's adapter to route through QQ, WeChat, WeCom, or another supported LangBot channel."
        zh_Hans: "用来给管理员发私聊的机器人。留空则用当前收到群消息的那个 bot。插件会根据所选 bot 的适配器，通过 QQ、微信、企微或其他 LangBot 支持的私聊渠道发送。"
      default: ''
      required: false

    - name: admin_notify_mode
      type: select
      label:
        en_US: Admin notify channel
        zh_Hans: 管理员通知方式
      description:
        en_US: "private: DM only. private_then_group: DM first, post the ticket in the group if DM cannot be confirmed. group: always post the ticket in the group. QQ official bots cannot DM via LangBot send_message (adapter stub); without AppID/Secret this falls back to the group."
        zh_Hans: "private：只私聊。private_then_group：先私聊，私聊无法确认成功就在本群补发病单。group：直接在本群发病单。QQ 官方适配器的 send_message 是空实现，不填 AppID/Secret 时私聊发不出去，会走群内补发。"
      default: private_then_group
      required: false
      options:
        - name: private_then_group
          label:
            en_US: Private, then group fallback
            zh_Hans: 先私聊，失败则群内补发
        - name: private
          label:
            en_US: Private only
            zh_Hans: 仅私聊
        - name: group
          label:
            en_US: Group only
            zh_Hans: 仅群内通知

    - name: admin_notify_platform
      type: select
      label:
        en_US: Admin DM platform
        zh_Hans: 私聊所用平台
      description:
        en_US: "Which transport delivers the admin DM. `auto` derives it from the selected bot's adapter. WeCom / WeChat need NO credentials here — LangBot's adapters already implement send_message, so picking the bot is enough. Only QQ official needs AppID/AppSecret, because its adapter's send_message is an upstream stub."
        zh_Hans: "用哪条链路给管理员发私聊。`auto` 按所选机器人的适配器自动判断。企业微信 / 微信**不需要**在这里填任何凭据——LangBot 的适配器已实现 send_message，选好机器人即可。只有 QQ 官方机器人需要 AppID/AppSecret，因为上游适配器的 send_message 是空实现。"
      default: auto
      required: false
      options:
        - name: auto
          label:
            en_US: Auto (from selected bot)
            zh_Hans: 自动（按所选机器人）
        - name: qq_official
          label:
            en_US: QQ official bot (needs AppID/Secret)
            zh_Hans: QQ 官方机器人（需 AppID/Secret）
        - name: wecom_bot
          label:
            en_US: WeCom smart bot (no credentials)
            zh_Hans: 企业微信智能机器人（免凭据）
        - name: wecom_app
          label:
            en_US: WeCom internal app (id = userid|agentid)
            zh_Hans: 企业微信内部应用（ID 填 userid|agentid）
        - name: wechat
          label:
            en_US: Personal WeChat (no credentials)
            zh_Hans: 微信个人机器人（免凭据）
        - name: disabled
          label:
            en_US: Disabled (no DM)
            zh_Hans: 关闭私聊通知

    - name: qqofficial_app_id
      type: string
      label:
        en_US: QQ official AppID
        zh_Hans: QQ 官方机器人 AppID
      description:
        en_US: "QQ official bots: AppID and AppSecret are read from LangBot bot info when the host exposes them. Otherwise fill these fields manually for direct C2C HTTP. Never reuse WeChat/WeCom tokens here."
        zh_Hans: "QQ 官方机器人：如果 LangBot 宿主暴露了凭据，插件会从所选 bot 信息读取 AppID 和 AppSecret；否则请手动填写以使用 C2C HTTP。不要把微信/企微 token 填在这里。"
      default: ''
      required: false
      show_if:
        field: admin_notify_platform
        operator: in
        value:
          - auto
          - qq_official

    - name: qqofficial_secret
      type: string
      label:
        en_US: QQ official AppSecret
        zh_Hans: QQ 官方机器人 AppSecret
      description:
        en_US: "Used only to obtain an access token for proactive C2C. If the selected LangBot bot exposes its secret, that value is preferred; this field is a compatibility fallback. Never sent to the review LLM."
        zh_Hans: "仅用于换取 access_token 以主动私聊。如果所选 LangBot bot 暴露了 AppSecret，则优先使用宿主提供的值；此项是兼容旧版宿主的手动回退。不会送给复核 LLM。"
      default: ''
      required: false
      show_if:
        field: admin_notify_platform
        operator: in
        value:
          - auto
          - qq_official

    - name: qqofficial_sandbox
      type: boolean
      label:
        en_US: QQ official sandbox API
        zh_Hans: 使用 QQ 官方沙箱 API
      description:
        en_US: Use sandbox.api.sgroup.qq.com instead of production.
        zh_Hans: 走 sandbox.api.sgroup.qq.com 而不是正式环境。
      default: false
      required: false
      show_if:
        field: admin_notify_platform
        operator: in
        value:
          - auto
          - qq_official

    - name: qqofficial_trust_send_message
      type: boolean
      label:
        en_US: Trust LangBot send_message on QQ official
        zh_Hans: 信任 QQ 官方适配器的 send_message
      description:
        en_US: Leave off. LangBot's qqofficial adapter currently implements send_message as pass. Turn on only after upstream actually sends C2C.
        zh_Hans: 默认关闭。LangBot 的 qqofficial 适配器目前 send_message 是空实现。只有上游真正能发 C2C 之后才打开。
      default: false
      required: false
      show_if:
        field: admin_notify_platform
        operator: in
        value:
          - auto
          - qq_official

    - name: whitelist_user_ids
      type: array[string]
      label:
        en_US: Whitelist user IDs
        zh_Hans: 白名单用户 ID
      description:
        en_US: These senders skip detection.
        zh_Hans: 这些发送者跳过检测。
      default: []
      required: false

    - name: reply_on_block
      type: boolean
      label:
        en_US: Reply in group on block
        zh_Hans: 拦截时在群里回复
      description:
        en_US: When a message is blocked, also send a short refusal in the group.
        zh_Hans: 拦截时是否在群里回一句拒绝提示。
      default: true
      required: false

    - name: block_reply_text
      type: string
      label:
        en_US: Block reply text
        zh_Hans: 群内拒绝文案
      description:
        en_US: Text sent to the group when a message is blocked.
        zh_Hans: 拦截时发到群里的文本。
      default: ⚠️ 检测到提示词注入风险，请求已被拦截，已转交人工客服。
      required: false

    - name: incidents_path
      type: string
      label:
        en_US: Incident log path
        zh_Hans: 病单文件路径
      description:
        en_US: "JSONL file name, or an absolute path. The installed plugin directory is read-only, so a bare name is written into the first writable runtime directory instead (`/data`, then `$HOME`, then the temp dir). Run `!pg where` to see the path actually in use."
        zh_Hans: "JSONL 文件名，也可填绝对路径。已安装的插件目录是只读的，所以只填文件名时会写入运行时第一个可写目录（依次尝试 `/data`、`$HOME`、临时目录）。用 `!pg where` 可以看到实际使用的路径。"
      default: incidents.jsonl
      required: false

    - name: notify_on_pass
      type: boolean
      label:
        en_US: DM admins for passed reviews too
        zh_Hans: 复核放行也私聊管理员
      description:
        en_US: "Send the full review record (local score, LLM verdict, raw model output, original text) to admins even when the message is allowed through. Useful as a push channel; for pulling records on demand use `!pg log` instead. Noisy in `active` mode."
        zh_Hans: "即使消息被复核放行，也把完整复核记录（本地分数、LLM 结论、模型原始返回、原文）私聊给管理员。适合当作实时推送；想按需查看请改用 `!pg log`。`active` 模式下会比较吵。"
      default: false
      required: false

    - name: notify_on_pass_group_fallback
      type: boolean
      label:
        en_US: Post passed-review record in group if DM fails
        zh_Hans: 放行记录私聊失败时在群内补发
      description:
        en_US: "Only used when the option above is on. Posts the passed-review record into the originating group when the DM could not be delivered. Visible to everyone in that group — leave off unless the group is staff-only."
        zh_Hans: "仅在上一项开启时生效。私聊送不出去时，把放行记录发到消息来源群。群内所有人可见——除非该群只有工作人员，否则请保持关闭。"
      default: false
      required: false
      show_if:
        field: notify_on_pass
        operator: eq
        value: true

    - name: review_audit_path
      type: string
      label:
        en_US: Review audit path
        zh_Hans: 复核审计文件路径
      description:
        en_US: "JSONL file name for every message actually sent to the review LLM, including passed verdicts. The installed plugin directory is read-only, so a bare name is written into the first writable runtime directory (`/data`, then `$HOME`, then the temp dir); an absolute path under a mounted volume is honoured. Read the records with `!pg log`, and `!pg where` for the path in use."
        zh_Hans: "记录每次实际送入复核 LLM 的消息（包括复核后放行）的 JSONL 文件名。已安装的插件目录是只读的，所以只填文件名时会写入运行时第一个可写目录（依次尝试 `/data`、`$HOME`、临时目录）；填挂载卷下的绝对路径也会被采用。用 `!pg log` 直接看记录，`!pg where` 看实际路径。"
      default: review_audit.jsonl
      required: false

    - name: rule_medium_threshold
      type: integer
      label:
        en_US: Medium severity threshold
        zh_Hans: medium 判定阈值
      description:
        en_US: "Score at which a message becomes `medium`. Lower = stricter. PTD 4.1.0 default: 7."
        zh_Hans: "达到多少分算 medium。调低更严格，调高更宽松。规则库默认 7。"
      default: 7
      required: false

    - name: rule_high_threshold
      type: integer
      label:
        en_US: High severity threshold
        zh_Hans: high 判定阈值
      description:
        en_US: "Score at which a message becomes `high`. Must be >= the medium threshold. PTD 4.1.0 default: 11."
        zh_Hans: "达到多少分算 high。必须不小于 medium 阈值，否则自动抬到与之相等。规则库默认 11。"
      default: 11
      required: false
  components:
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Command:
      fromDirs:
        - path: components/commands/
execution:
  python:
    path: main.py
    attr: PromptGuardian
